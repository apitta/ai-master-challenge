# Local: API e interface como serviços separados, banco persistido em volume.
#   docker compose up --build   →  http://localhost:8501  (API em http://localhost:8000/docs)
services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - pipeline-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      start_period: 15s

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pipeline-data:
